{% extends 'base.html' %}

{% block content %}
  <h1>Список продуктов</h1>
  {% if perms.shopapp.add_product %}
    <a href="{% url 'shopapp:product_create' %}">Создать продукт</a>
  {% endif %}
  <ul>
    {% for product in products %}
      <li>
        {{ product.name }} -
        <a href="{% url 'shopapp:product_update' product.pk %}">Редактировать</a>
      </li>
    {% empty %}
      <li>Продуктов пока нет.</li>
    {% endfor %}
  </ul>
{% endblock %}
