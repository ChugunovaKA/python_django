<ul>
    {% for product in products %}
        <li>
            <a href="{% url 'shopapp:product_details' product.pk %}">{{ product.name }}</a> — {{ product.price }}
            {% if perms.shopapp.change_product %}
                | <a href="{% url 'shopapp:product_update' product.pk %}">Редактировать</a>
            {% endif %}
        </li>
    {% empty %}
        <li>Нет продуктов для отображения.</li>
    {% endfor %}
</ul>
