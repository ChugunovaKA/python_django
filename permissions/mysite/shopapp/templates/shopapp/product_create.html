<!-- shopapp/templates/shopapp/product_create.html -->

{% extends "shopapp/base.html" %}

{% block title %}
  Create Product
{% endblock %}

{% block body %}
  <h1>Create a new product</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Create</button>
  </form>
{% endblock %}
