<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>{{ product.name }}</title>
</head>
<body>
    <h1>{{ product.name }}</h1>
    <p><strong>Описание:</strong> {{ product.description }}</p>
    <p><strong>Цена:</strong> {{ product.price }}</p>
    <p><strong>Архивирован:</strong> {{ product.archived }}</p>

    <a href="{% url 'shopapp:products_list' %}">Назад к списку продуктов</a> |
    <a href="{% url 'shopapp:product_update' pk=product.pk %}">Редактировать продукт</a> |
    <a href="{% url 'shopapp:product_archive' pk=product.pk %}">Архивировать продукт</a>
</body>
</html>
