{% extends "admin/base_site.html" %}
{% load static %}

{% block content %}
  <h1>Импорт заказов из CSV</h1>

  <form method="post" enctype="multipart/form-data" novalidate>
    {% csrf_token %}
    {{ form.as_p }}

    <input type="submit" value="Загрузить">
  </form>

  <p><a href="{% url 'admin:shopapp_order_changelist' %}">Вернуться к списку заказов</a></p>
{% endblock %}
