{% extends "admin/base_site.html" %}
{% load i18n %}

{% block content %}
  <h1>{% trans "Импорт заказов из CSV" %}</h1>

  <form method="post" enctype="multipart/form-data" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="default">{% trans "Загрузить" %}</button>
    <a href="{% url 'admin:shopapp_order_changelist' %}" class="button cancel-link">{% trans "Отмена" %}</a>
  </form>
{% endblock %}
