{% extends "shopapp/base.html" %}

{% block title %}Список продуктов{% endblock %}

{% block content %}
<h2>Список продуктов</h2>
<ul>
    {% for product in products %}
        <li>{{ product.name }} — {{ product.price }} ₽</li>
    {% empty %}
        <li>Продукты отсутствуют.</li>
    {% endfor %}
</ul>
{% endblock %}
