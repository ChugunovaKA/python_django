<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Практическая работа 7.15 — Исправлено расположение кнопки и соцсетей</title>

<!-- Подключение шрифта Roboto -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,700;1,400;1,700&display=swap"
  rel="stylesheet"
/>

<style>
  /* Общие стили */
  * {
    box-sizing: border-box;
    font-family: 'Roboto', sans-serif;
  }
  body {
    margin: 0;
    line-height: 1.5;
  }

  /* ====== ХЕДЕР ====== */
  header {
    padding: 20px 40px;
    background-color: #fff;
  }
  header nav {
    display: flex;
  }
  header nav a {
    color: black;
    text-decoration: none;
    margin-right: 30px;
    font-weight: 500;
    font-size: 16px;
  }
  header nav a:last-child {
    margin-right: 0;
  }
  header nav a:hover {
    text-decoration: underline;
  }

  /* ====== ПЕРВЫЙ БЛОК ====== */
  .hero {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 60px 40px;
    background: url('https://via.placeholder.com/600x400') no-repeat right center;
    background-size: contain;
    min-height: 400px; /* увеличенная высота */
    background-color: #eaeaea;
  }
  .hero-text {
    max-width: 50%;
  }
  .hero h1 {
    font-size: 48px;
    margin-top: 0;
    margin-bottom: 20px;
  }
  .hero h2 {
    font-size: 32px;
    margin-top: 0;
    margin-bottom: 30px;
    font-weight: 400;
  }
  .hero button {
    padding: 14px 30px;
    font-size: 16px;
    cursor: pointer;
    margin: 0;
  }

  /* ====== БЛОК С ПРИМЕРАМИ РАБОТ ====== */
  .works {
    display: flex;
    justify-content: space-between;
    padding: 40px;
  }
  .work-item {
    width: 32%;
    background-color: #f0f0f0;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 0 5px rgba(0,0,0,0.1);
  }
  .work-item img {
    width: 100%;
    display: block;
  }

  /* ====== СИНИЙ БЛОК ====== */
  .blue-block {
    background-color: #007bff;
    color: white;
    padding: 40px;
    text-align: center;
  }
  .blue-block h2, .blue-block p {
    margin: 0 auto 20px;
    width: 50%;
  }
  .blue-block p {
    font-size: 14px;
  }

  /* ====== ФУТЕР ====== */
  footer {
    background-color: #f8f8f8;
    padding: 40px;
    display: flex;
    justify-content: space-between;
    gap: 40px;
    flex-wrap: wrap;
  }
  .footer-menu {
    flex: 1;
    min-width: 220px;
  }
  .footer-menu div {
    display: flex;
    flex-direction: column;
  }
  .footer-menu a {
    text-decoration: none;
    color: black;
    margin-bottom: 10px;
    font-weight: 500;
  }
  .footer-menu a:hover {
    text-decoration: underline;
  }

  /* Блок справа с контактами и соцсетями, расположение вертикальное */
  .footer-right {
    flex: 1;
    min-width: 220px;
    display: flex;
    flex-direction: column;
  }

  .footer-contacts {
    margin-bottom: 20px;
  }
  .footer-contacts p {
    margin: 8px 0;
    font-size: 14px;
  }
  .footer-contacts button {
    cursor: pointer;
    padding: 10px 20px;
    font-size: 14px;
  }

  .footer-social {
    display: flex;
    gap: 15px;
  }
  .footer-social a {
    display: inline-block;
  }
  .footer-social img {
    width: 24px;
    height: 24px;
  }

  /* ====== ВСПЛЫВАЮЩЕЕ ОКНО ====== */
  .popup-container {
    position: fixed;
    top: 0;
    left: 0;
    right:0;
    bottom:0;
    background: rgba(0,0,0,0.5);
    display: none; /* скрыто по умолчанию */
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }
  .popup {
    background: white;
    padding: 30px;
    border-radius: 8px;
    width: 320px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    display: flex;
    flex-direction: column;
  }
  .popup input[type="text"], .popup input[type="email"] {
    padding: 10px;
    margin-bottom: 15px;
    font-size: 14px;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  .popup button {
    cursor: pointer;
    padding: 12px;
    font-size: 16px;
    background-color: #007bff;
    border: none;
    color: white;
    border-radius: 4px;
  }
</style>
</head>
<body>

<header>
  <nav>
    <a href="#">Услуги</a>
    <a href="#">Портфолио</a>
    <a href="#">Стоимость</a>
  </nav>
</header>

<section class="hero">
  <div class="hero-text">
    <h1>Заголовок H1 большого размера</h1>
    <h2>Подзаголовок H2 среднего размера</h2>
    <button class="open-popup">Заказать звонок</button>
  </div>
</section>

<section class="works">
  <div class="work-item">
    <img src="https://via.placeholder.com/300x200?text=Работа+1" alt="Пример работы 1" />
  </div>
  <div class="work-item">
    <img src="https://via.placeholder.com/300x200?text=Работа+2" alt="Пример работы 2" />
  </div>
  <div class="work-item">
    <img src="https://via.placeholder.com/300x200?text=Работа+3" alt="Пример работы 3" />
  </div>
</section>

<section class="blue-block">
  <h2>Заголовок синего блока</h2>
  <p>Мелкий текст под заголовком, поясняющий информацию.</p>
</section>

<footer>
  <div class="footer-menu">
    <div>
      <a href="#">Услуги</a>
      <a href="#">Портфолио</a>
      <a href="#">Стоимость</a>
    </div>
  </div>
  <div class="footer-right">
    <div class="footer-contacts">
      <p>Email: example@mail.com</p>
      <p>Телефон: +7 123 456 7890</p>
      <button class="open-popup">Заказать звонок</button>
    </div>
    <div class="footer-social">
      <a href="#" aria-label="Facebook"><img src="https://cdn-icons-png.flaticon.com/512/174/174848.png" alt="Facebook"></a>
      <a href="#" aria-label="Instagram"><img src="https://cdn-icons-png.flaticon.com/512/174/174855.png" alt="Instagram"></a>
      <a href="#" aria-label="Twitter"><img src="https://cdn-icons-png.flaticon.com/512/733/733579.png" alt="Twitter"></a>
    </div>
  </div>
</footer>

<!-- Всплывающее окно -->
<div class="popup-container" tabindex="-1">
  <div class="popup" role="dialog" aria-modal="true" aria-labelledby="popupTitle">
    <input type="text" placeholder="Введите ваше имя" />
    <input type="email" placeholder="Введите Email" />
    <button id="popup-send-btn">Отправить</button>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
  var container = document.querySelector('.popup-container');
  var popupButtons = document.querySelectorAll('.open-popup');
  var sendBtn = document.getElementById('popup-send-btn');

  popupButtons.forEach(function(btn) {
    btn.addEventListener('click', function() {
      container.style.display = 'flex';
      container.focus();
    });
  });

  // Закрыть при клике вне окна
  container.addEventListener('click', function(event) {
    if(event.target === container) {
      container.style.display = 'none';
    }
  });

  // Закрыть при клике на кнопку Отправить
  sendBtn.addEventListener('click', function() {
    container.style.display = 'none';
  });
});
</script>

</body>
</html>
