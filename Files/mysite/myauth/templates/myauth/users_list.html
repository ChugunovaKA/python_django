{% extends 'myauth/base.html' %}

{% block title %}Список пользователей{% endblock %}

{% block body %}
  <h1>Пользователи</h1>
  <ul>
    {% for user in users %}
      <li>
        {% if user.profile.avatar %}
          <img src="{{ user.profile.avatar.url }}" alt="Аватар {{ user.username }}" style="width:40px; height:40px; object-fit: cover; vertical-align: middle;">
        {% endif %}
        <a href="{% url 'myauth:profile-detail' user.username %}">{{ user.username }}</a>
      </li>
    {% empty %}
      <li>Пользователей нет</li>
    {% endfor %}
  </ul>
{% endblock %}
