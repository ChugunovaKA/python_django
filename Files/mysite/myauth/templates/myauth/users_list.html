{% extends 'myauth/base.html' %}

{% block title %}
  Users list
{% endblock %}

{% block body %}
  <h1>Users list</h1>

  <ul>
    {% for user in users %}
      <li>
        <a href="{% url 'myauth:profile-detail' user.username %}">
          {{ user.username }}
        </a>
        {% if user.profile.avatar %}
          <img src="{{ user.profile.avatar.url }}" alt="Avatar" style="width: 50px; height: 50px; object-fit: cover;">
        {% else %}
          <span>No avatar</span>
        {% endif %}
      </li>
    {% empty %}
      <li>No users found.</li>
    {% endfor %}
  </ul>
{% endblock %}
